name: Render 24/7 Keep-Alive Ping

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend API every 10 minutes
        run: |
          curl -fsS --max-time 30 https://loksewa-prep-app.onrender.com/api/ping || curl -fsS --max-time 30 https://loksewa-prep-app.onrender.com/api/health
