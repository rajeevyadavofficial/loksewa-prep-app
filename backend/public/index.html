<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="LoksewaHero — All-in-One Civil Service, Banking, Technical/IT & Public Enterprise Exam Preparation Platform.">
  <meta name="keywords" content="loksewa, LoksewaHero, PSC, Section Officer, Nayab Subba, Kharidar, RBB, NRB, ADBL, Nepal exam">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LoksewaHero">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LoksewaHero | Civil Service, Banking, IT & Sansthan Exams</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #FFFFFF;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #111111;
      z-index: 9999;
    }
    #loading h2 {
      font-size: 20px;
      font-weight: 800;
      margin: 18px 0 6px;
      letter-spacing: -0.4px;
      color: #111111;
    }
    #loading p {
      color: #71717A;
      font-size: 13px;
      margin: 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #E4E4E7;
      border-top-color: #DC2626;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2>LoksewaHero</h2>
    <p>Loading Civil Service, Banking, IT & Sansthan Exam Portal...</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        entrypointUrl: "main.dart.js?v=" + Date.now(),
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            var loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.remove();
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
